name: Build FINA Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/android-launch.test.mjs'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar JavaScript e regras essenciais antes de gerar APK
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar QA da FINA
        run: |
          node tests/check-web.mjs
          node --test tests/android-launch.test.mjs

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Testar abertura no emulador Android (sem fechar o aplicativo)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n app.fina.casal.debug/app.fina.casal.FinaLauncherActivity
            sleep 7
            adb shell pidof app.fina.casal.debug
            adb logcat -d -s AndroidRuntime:E FinaLauncher:E
            if adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then
              echo "ERRO: launcher Android caiu durante a abertura"
              exit 1
            fi

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/FINA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FINA-Android-debug
          path: artifact/FINA-debug.apk
          if-no-files-found: error
          retention-days: 14
