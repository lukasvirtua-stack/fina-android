name: Build FINA Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/android-launch.test.mjs'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar JavaScript e regras essenciais antes de gerar APK
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar QA da FINA
        run: |
          node tests/check-web.mjs
          node --test tests/android-launch.test.mjs

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Conferir assinatura e instalabilidade do APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 24 --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/fina-apk-badging.txt
          grep -F "package: name='app.fina.casal.debug'" /tmp/fina-apk-badging.txt
          grep -F "launchable-activity: name='app.fina.casal.FinaLauncherActivity'" /tmp/fina-apk-badging.txt
          sha256sum "$APK"

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/FINA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FINA-Android-debug
          path: artifact/FINA-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Habilitar KVM para emulador Android
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "Aceleracao KVM indisponivel neste runner"
          fi

      - name: Testar abertura no emulador Android (sem fechar o aplicativo)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n app.fina.casal.debug/app.fina.casal.FinaLauncherActivity
            sleep 7
            adb shell pidof app.fina.casal.debug
            adb logcat -d -s AndroidRuntime:E FinaLauncher:E
            if adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then
              echo "ERRO: launcher Android caiu durante a abertura"
              exit 1
            fi

