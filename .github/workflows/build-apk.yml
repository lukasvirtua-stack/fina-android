name: Build FINA Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar JavaScript e regras essenciais antes de gerar APK
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar QA da FINA
        run: node tests/check-web.mjs

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/FINA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FINA-Android-debug
          path: artifact/FINA-debug.apk
          if-no-files-found: error
          retention-days: 14
