name: Regressão financeira FINA
on:
  push:
    branches: [main]
    paths:
      - web/index.html
      - web/service-worker.js
      - web/offline-vault.js
      - tests/offline-vault.test.mjs
      - tests/financial-invariants.test.mjs
      - supabase/functions/fina-safe-auto-sync/index.ts
      - supabase/functions/fina-pluggy-webhook/index.ts
      - supabase/functions/fina-pluggy-webhook-setup/index.ts
      - supabase/migrations/20261114130000_fina_pluggy_webhook.sql
      - tests/pluggy-webhook.test.mjs
      - tests/history-rescan.test.mjs
      - tests/partner-webhook-provision.test.mjs
      - tests/bills-webhook-recovery.test.mjs
      - supabase/migrations/20261114172000_fina_bills_webhook_recovery.sql
      - supabase/migrations/20261114133000_fina_history_rescan.sql
      - tests/sync-coverage.test.mjs
      - tests/finance-rules.test.mjs
      - tests/pwa-cache.test.mjs
      - .github/workflows/fina-finance.yml
  pull_request:
    paths:
      - web/index.html
      - web/service-worker.js
      - web/offline-vault.js
      - tests/offline-vault.test.mjs
      - tests/financial-invariants.test.mjs
      - supabase/functions/fina-safe-auto-sync/index.ts
      - supabase/functions/fina-pluggy-webhook/index.ts
      - supabase/functions/fina-pluggy-webhook-setup/index.ts
      - supabase/migrations/20261114130000_fina_pluggy_webhook.sql
      - tests/pluggy-webhook.test.mjs
      - tests/history-rescan.test.mjs
      - tests/partner-webhook-provision.test.mjs
      - tests/bills-webhook-recovery.test.mjs
      - supabase/migrations/20261114172000_fina_bills_webhook_recovery.sql
      - supabase/migrations/20261114133000_fina_history_rescan.sql
      - tests/sync-coverage.test.mjs
      - tests/finance-rules.test.mjs
      - tests/pwa-cache.test.mjs
      - .github/workflows/fina-finance.yml
jobs:
  financial-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/finance-rules.test.mjs tests/pwa-cache.test.mjs tests/offline-vault.test.mjs tests/financial-invariants.test.mjs tests/sync-coverage.test.mjs tests/pluggy-webhook.test.mjs tests/history-rescan.test.mjs tests/partner-webhook-provision.test.mjs tests/bills-webhook-recovery.test.mjs
