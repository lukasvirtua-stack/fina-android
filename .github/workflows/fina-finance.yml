name: Regressão financeira FINA
on:
  push:
    branches: [main]
    paths:
      - web/index.html
      - web/service-worker.js
      - web/offline-vault.js
      - tests/offline-vault.test.mjs
      - tests/financial-invariants.test.mjs
      - tests/finance-rules.test.mjs
      - tests/pwa-cache.test.mjs
      - .github/workflows/fina-finance.yml
  pull_request:
    paths:
      - web/index.html
      - web/service-worker.js
      - web/offline-vault.js
      - tests/offline-vault.test.mjs
      - tests/financial-invariants.test.mjs
      - tests/finance-rules.test.mjs
      - tests/pwa-cache.test.mjs
      - .github/workflows/fina-finance.yml
jobs:
  financial-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/finance-rules.test.mjs tests/pwa-cache.test.mjs tests/offline-vault.test.mjs tests/financial-invariants.test.mjs
