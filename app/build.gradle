plugins {
    id 'com.android.application'
}

android {
    namespace 'app.fina.casal'
    compileSdk 36

    defaultConfig {
        applicationId "app.fina.casal"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
