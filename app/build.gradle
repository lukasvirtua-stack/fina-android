plugins {
    id 'com.android.application'
}

android {
    namespace 'app.fina.casal'
    compileSdk 36

    defaultConfig {
        applicationId "app.fina.casal"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}


// AndroidX Browser e dependências antigas exigem uma única versão Kotlin;
// misturar kotlin-stdlib 1.8.22 com kotlin-stdlib-jdk8 1.6.21 impede gerar APK.
configurations.configureEach {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    implementation 'androidx.browser:browser:1.9.0'
}
