plugins {
    id 'com.android.application'
}

android {
    namespace 'app.fina.casal'
    compileSdk 36

    defaultConfig {
        applicationId "app.fina.casal"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.9.0'
}
